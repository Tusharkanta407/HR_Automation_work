# Local infra: Redis only.
# PostgreSQL is provided by Neon (cloud project).

services:
  redis:
    image: redis:7-alpine
    container_name: hr-automation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
